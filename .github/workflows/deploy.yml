name: Build & Deploy to S3

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  S3_ENDPOINT: "https://de-s3.storage.bunnycdn.com"
  S3_REGION: "default"
  S3_BUCKET: "wander-mark"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install wander-mark-cli from JSR
        run: |
          mkdir -p /tmp/wm-cli
          cd /tmp/wm-cli
          echo '{"name":"wm-cli","private":true}' > package.json
          bun add npm:@jsr/injurka__wander-mark-cli
          echo "Installed at /tmp/wm-cli"

      - name: Run wander-mark-cli (generate + deploy to S3)
        run: |
          bun run \
            --cwd /tmp/wm-cli \
            node_modules/.bin/wander-mark \
            -c ${{ github.workspace }}/.obsidian/export/config.json \
            -d \
            -m s3
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
