name: Build & Deploy to S3

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  S3_ENDPOINT: "https://de-s3.storage.bunnycdn.com"
  S3_REGION: "default"
  S3_BUCKET: "limited-dissolve"
  S3_BASE_PATH: "wander-mark"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install wander-mark-cli from npm
        run: npm install --global @limiteddissolve/wander-mark-cli@1.1.2

      - name: Prepare config for CI paths
        run: |
          CONFIG="${{ github.workspace }}/.obsidian/export/config.json"
          # Заменяем абсолютные пути /home/injurka/Documents/obsidian-mark на ${{ github.workspace }}
          sed -i "s|/home/injurka/Documents/obsidian-mark|${{ github.workspace }}|g" "$CONFIG"

      - name: Run wander-mark-cli (generate + deploy to S3)
        run: |
          wander-mark \
            --config "${{ github.workspace }}/.obsidian/export/config.json" \
            --deploy \
            --deploy-mode s3
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
