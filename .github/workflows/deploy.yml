name: Build & Deploy to S3

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  S3_ENDPOINT: "https://de-s3.storage.bunnycdn.com"
  S3_REGION: "default"
  S3_BUCKET: "limited-dissolve"
  S3_BASE_PATH: "wander-mark"
  SERVER_URL: "https://wander-api.limited-dissolve.ru"

# All branches deploy to the same S3 prefix. Never interrupt an active upload.
concurrency:
  group: wander-mark-s3-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # CLI emits extensionless ESM imports; Bun resolves them.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'

      - name: Install wander-mark-cli from npm
        run: npm install --global @limiteddissolve/wander-mark-cli@1.1.2

      - name: Prepare config for CI paths
        run: |
          CONFIG="${{ github.workspace }}/.obsidian/export/config.json"
          # Заменяем абсолютные пути /home/injurka/Documents/obsidian-mark на ${{ github.workspace }}
          sed -i "s|/home/injurka/Documents/obsidian-mark|${{ github.workspace }}|g" "$CONFIG"

      - name: Generate export
        run: |
          bun "$(command -v wander-mark)" \
            --config "${{ github.workspace }}/.obsidian/export/config.json"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install S3 client
        run: python -m pip install boto3

      - name: Deploy changed export files
        run: python .github/scripts/deploy.py
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
